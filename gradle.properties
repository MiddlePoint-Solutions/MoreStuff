kotlin.code.style=official
xcodeproj=./iosApp
android.useAndroidX=true

org.gradle.jvmargs=-Xmx6g -Dkotlin.daemon.jvm.options="-Xmx8g"

kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.incremental.native=false
kotlin.native.memoryModel=experimental

android.nonTransitiveRClass=false
android.nonFinalResIds=false
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true

# BuildConfig
app.morestuff.debug=true
app.morestuff.versionName=0.9.0
app.morestuff.versionCode=47

# Deeplinks
app.morestuff.scheme=app.morestuff
app.morestuff.host.login=login-callback


# iOS
org.jetbrains.compose.experimental.uikit.enabled=true

kotlin.native.binary.options=-Xbinary=bundleId=io.middlepoint.morestuff
kotlin.native.cacheKind=none
